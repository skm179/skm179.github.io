<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Learning Path</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #05070a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
           MAIN APPLICATION
        ========================= */

        .app {
            display: flex;
            min-height: 100vh;
            background: #05070a;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 315px;
            min-height: 100vh;
            padding: 24px 22px;
            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    #061d73 0%,
                    #0752a5 35%,
                    #008a89 68%,
                    #04a51e 100%
                );

            border-right: 1px solid rgba(255,255,255,0.15);
            box-shadow: 8px 0 35px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           LOGO
        ========================= */

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 38px;
        }

        .logo {
            width: 245px;
            height: 245px;
            object-fit: contain;
            filter: drop-shadow(0 12px 25px rgba(0,0,0,0.35));
        }

        /* =========================
           MENU TITLE
        ========================= */

        .menu-title {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin: 0 0 14px 10px;
            color: rgba(255,255,255,0.9);
        }

        /* =========================
           MENU BUTTON
        ========================= */

        .menu-button {
            width: 100%;
            min-height: 68px;

            display: flex;
            align-items: center;
            gap: 18px;

            padding: 12px 18px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 174, 255, 0.35),
                    rgba(0, 255, 153, 0.22)
                );

            color: white;
            text-decoration: none;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 8px 20px rgba(0,0,0,0.15);

            transition: all 0.25s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px);

            border-color: #39ff14;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 174, 255, 0.55),
                    rgba(0, 255, 153, 0.35)
                );

            box-shadow:
                0 0 20px rgba(0, 255, 153, 0.25),
                0 10px 25px rgba(0,0,0,0.25);
        }

        .menu-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: rgba(255,255,255,0.92);

            color: #0752a5;

            font-size: 20px;
            font-weight: bold;
        }

        .menu-text {
            flex: 1;

            font-size: 19px;
            font-weight: 600;
        }

        .menu-arrow {
            font-size: 28px;
            color: #ffffff;
        }

        /* =========================
           SIDEBAR FOOTER
        ========================= */

        .sidebar-footer {
            margin-top: auto;

            padding-top: 25px;

            border-top: 1px solid rgba(255,255,255,0.20);

            text-align: center;

            font-size: 14px;
            line-height: 1.6;

            color: rgba(255,255,255,0.9);
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            flex: 1;
            min-width: 0;

            background:
                radial-gradient(
                    circle at 70% 15%,
                    rgba(0, 110, 255, 0.06),
                    transparent 35%
                ),
                #05070a;

            padding: 42px 48px;
        }

        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;

            font-size: 30px;
            font-weight: 600;

            padding-bottom: 28px;

            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .home-icon {
            color: #00d9ff;
            font-size: 34px;
        }

        /* =========================
           TITLE
        ========================= */

        .hero {
            padding: 42px 0 34px;
        }

        .hero h1 {
            font-size: clamp(42px, 5vw, 64px);
            font-weight: 700;
            line-height: 1.05;
            margin-bottom: 16px;

            color: #ffffff;
        }

        .hero h1 .blue {
            color: #119cff;
        }

        .hero h1 .green {
            color: #39e600;
        }

        .hero p {
            font-size: 21px;
            color: rgba(255,255,255,0.78);
        }

        /* =========================
           INTUNE CARD
        ========================= */

        .cards {
            width: 100%;
            max-width: 900px;
        }

        .learning-card {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 295px;

            padding: 42px 48px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(12, 20, 30, 0.95),
                    rgba(5, 9, 13, 0.98)
                );

            border: 2px solid transparent;

            background-clip: padding-box;

            box-shadow:
                0 0 0 1px rgba(0, 183, 255, 0.75),
                0 0 35px rgba(0, 174, 255, 0.08);

            overflow: hidden;

            text-decoration: none;
            color: white;

            transition: all 0.3s ease;
        }

        .learning-card::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: 18px;

            padding: 2px;

            background:
                linear-gradient(
                    120deg,
                    #00b7ff,
                    #00d9ff,
                    #39ff14
                );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;
            mask-composite: exclude;

            pointer-events: none;
        }

        .learning-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 0 0 1px #00c8ff,
                0 0 40px rgba(0, 183, 255, 0.25),
                0 15px 35px rgba(0,0,0,0.35);
        }

        /* =========================
           INTUNE ICON
        ========================= */

        .card-icon {
            width: 170px;
            height: 170px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 48px;

            border-radius: 20px;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 130, 255, 0.25),
                    transparent 70%
                );

            font-size: 95px;
        }

        .intune-icon {
            position: relative;

            width: 115px;
            height: 95px;
        }

        .screen-one,
        .screen-two {
            position: absolute;

            width: 72px;
            height: 72px;

            border-radius: 10px;

            background:
                linear-gradient(
                    145deg,
                    #27d3ff,
                    #0878ed
                );

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 8px 20px rgba(0, 140, 255, 0.35);
        }

        .screen-one {
            left: 4px;
            top: 4px;
        }

        .screen-two {
            right: 0;
            bottom: 0;
        }

        .screen-one::after,
        .screen-two::after {
            content: "";

            position: absolute;

            width: 24px;
            height: 24px;

            border-radius: 50%;

            background: rgba(0,50,150,0.65);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }

        /* =========================
           CARD CONTENT
        ========================= */

        .card-content {
            flex: 1;
        }

        .card-content h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .card-content p {
            font-size: 20px;
            line-height: 1.5;

            color: rgba(255,255,255,0.72);

            max-width: 480px;
        }

        .card-arrow {
            font-size: 58px;
            font-weight: 300;

            color: #39ff14;

            margin-left: 25px;

            transition: transform 0.25s ease;
        }

        .learning-card:hover .card-arrow {
            transform: translateX(8px);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 240px;
            }

            .logo {
                width: 190px;
                height: 190px;
            }

            .main-content {
                padding: 30px;
            }

            .learning-card {
                padding: 30px;
            }

            .card-icon {
                margin-right: 25px;
            }
        }

        @media (max-width: 700px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .logo {
                width: 170px;
                height: 170px;
            }

            .sidebar-footer {
                margin-top: 30px;
            }

            .main-content {
                padding: 25px 20px;
            }

            .page-header {
                font-size: 24px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .learning-card {
                flex-direction: column;
                text-align: center;
            }

            .card-icon {
                margin: 0 0 25px;
            }

            .card-arrow {
                margin: 20px 0 0;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo-container">

            <img
                src="learning-path-logo.png"
                alt="Learning Path Logo"
                class="logo"
            >

        </div>

        <div class="menu-title">
            MENU
        </div>

        <a href="intune.html" class="menu-button">

            <div class="menu-icon">
                ▦
            </div>

            <div class="menu-text">
                Intune
            </div>

            <div class="menu-arrow">
                ›
            </div>

        </a>

        <div class="sidebar-footer">

            © 2026 My Learning Path.<br>
            All Rights Reserved.

        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <div class="page-header">

            <span class="home-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </div>


        <section class="hero">

            <h1>
                My
                <span class="blue">Learning</span>
                <span class="green">Path</span>
            </h1>

            <p>
                Select a topic to start learning and exploring.
            </p>

        </section>


        <!-- =========================
             INTUNE TILE
        ========================== -->

        <section class="cards">

            <a href="intune.html" class="learning-card">

                <div class="card-icon">

                    <div class="intune-icon">

                        <div class="screen-one"></div>
                        <div class="screen-two"></div>

                    </div>

                </div>


                <div class="card-content">

                    <h2>
                        Intune
                    </h2>

                    <p>
                        Learn Microsoft Intune for
                        Endpoint Management
                    </p>

                </div>


                <div class="card-arrow">
                    →
                </div>

            </a>

        </section>

    </main>

</div>

</body>
</html>
