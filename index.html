<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Learning Path</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #05070a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* =========================
           APPLICATION
        ========================== */

        .app {
            display: flex;
            min-height: 100vh;
            background: #05070a;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 280px;
            min-height: 100vh;

            padding: 24px 18px;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    #061d73 0%,
                    #0752a5 35%,
                    #008a89 68%,
                    #04a51e 100%
                );

            border-right: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                8px 0 35px rgba(0,0,0,0.35);
        }

        /* =========================
           LOGO
        ========================== */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 42px;
        }

        .logo {
            width: 235px;
            height: 235px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 12px 25px rgba(0,0,0,0.35)
                );
        }

        /* =========================
           MENU
        ========================== */

        .menu-title {
            font-size: 15px;
            font-weight: 600;

            letter-spacing: 0.5px;

            margin: 0 0 14px 8px;

            color: rgba(255,255,255,0.9);
        }

        .menu-button {
            width: 100%;
            min-height: 64px;

            display: flex;
            align-items: center;

            gap: 16px;

            padding: 10px 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(0,174,255,0.35),
                    rgba(0,255,153,0.22)
                );

            color: white;

            text-decoration: none;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 8px 20px rgba(0,0,0,0.15);

            transition: all 0.25s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px);

            border-color: #39ff14;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,174,255,0.55),
                    rgba(0,255,153,0.35)
                );

            box-shadow:
                0 0 20px rgba(0,255,153,0.25),
                0 10px 25px rgba(0,0,0,0.25);
        }

        .menu-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: rgba(255,255,255,0.95);

            color: #0752a5;

            font-size: 20px;
            font-weight: bold;
        }

        .menu-text {
            flex: 1;

            font-size: 18px;
            font-weight: 600;
        }

        .menu-arrow {
            font-size: 26px;
        }

        /* =========================
           SIDEBAR FOOTER
        ========================== */

        .sidebar-footer {
            margin-top: auto;

            padding-top: 22px;

            border-top:
                1px solid rgba(255,255,255,0.20);

            text-align: center;

            font-size: 13px;
            line-height: 1.6;

            color: rgba(255,255,255,0.9);
        }

        /* =========================
           MAIN CONTENT
        ========================== */

        .main-content {
            flex: 1;
            min-width: 0;

            padding: 40px 48px;

            background:
                radial-gradient(
                    circle at 70% 10%,
                    rgba(0,110,255,0.06),
                    transparent 35%
                ),
                #05070a;
        }

        /* =========================
           PAGE HEADER
        ========================== */

        .page-header {
            display: flex;
            align-items: center;

            gap: 13px;

            font-size: 30px;
            font-weight: 600;

            padding-bottom: 26px;

            border-bottom:
                1px solid rgba(255,255,255,0.12);
        }

        .home-icon {
            color: #00d9ff;
            font-size: 32px;
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            padding: 40px 0 28px;
        }

        .hero h1 {
            font-size: clamp(42px, 5vw, 62px);

            font-weight: 700;

            line-height: 1.05;

            margin-bottom: 15px;
        }

        .hero h1 .blue {
            color: #119cff;
        }

        .hero h1 .green {
            color: #39e600;
        }

        .hero p {
            font-size: 20px;

            color:
                rgba(255,255,255,0.72);
        }

        /* =========================
           CARD CONTAINER
        ========================== */

        .cards {
            width: 100%;
        }

        /* =========================
           INTUNE TILE
        ========================== */

        .learning-card {

            /* IMPORTANT:
               Compact fixed width
            */
            width: 620px;
            max-width: 100%;

            height: 150px;

            display: flex;
            align-items: center;

            padding: 18px 22px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(12,20,30,0.98),
                    rgba(5,9,13,0.98)
                );

            border: 1px solid #00b7ff;

            box-shadow:
                0 0 0 1px rgba(0,183,255,0.30),
                0 0 25px rgba(0,183,255,0.07);

            text-decoration: none;

            color: white;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        /* Gradient accent around the tile */

        .learning-card::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 15px;

            padding: 1px;

            background:
                linear-gradient(
                    120deg,
                    #00b7ff,
                    #00d9ff,
                    #39ff14
                );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            pointer-events: none;
        }

        .learning-card:hover {

            transform:
                translateY(-3px);

            border-color:
                #00d9ff;

            box-shadow:
                0 0 25px rgba(0,183,255,0.20),
                0 10px 28px rgba(0,0,0,0.35);
        }

        /* =========================
           INTUNE ICON AREA
        ========================== */

        .card-icon {

            width: 82px;
            height: 82px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 24px;

            border-radius: 14px;

            background:
                radial-gradient(
                    circle,
                    rgba(0,130,255,0.20),
                    transparent 70%
                );
        }

        .intune-icon {

            position: relative;

            width: 62px;
            height: 55px;
        }

        .screen-one,
        .screen-two {

            position: absolute;

            width: 43px;
            height: 43px;

            border-radius: 7px;

            background:
                linear-gradient(
                    145deg,
                    #27d3ff,
                    #0878ed
                );

            box-shadow:
                0 6px 15px rgba(0,140,255,0.30);
        }

        .screen-one {

            left: 0;
            top: 0;
        }

        .screen-two {

            right: 0;
            bottom: 0;
        }

        .screen-one::after,
        .screen-two::after {

            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background:
                rgba(0,50,150,0.65);

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);
        }

        /* =========================
           CARD TEXT
        ========================== */

        .card-content {

            min-width: 0;

            flex: 0 1 auto;
        }

        .card-content h2 {

            font-size: 27px;

            margin-bottom: 6px;

            font-weight: 650;
        }

        .card-content p {

            font-size: 15px;

            line-height: 1.4;

            white-space: nowrap;

            color:
                rgba(255,255,255,0.68);
        }

        /* =========================
           ARROW
        ========================== */

        .card-arrow {

            margin-left: auto;

            padding-left: 28px;

            font-size: 40px;

            font-weight: 300;

            color:
                #39ff14;

            flex-shrink: 0;

            transition:
                transform 0.25s ease;
        }

        .learning-card:hover .card-arrow {

            transform:
                translateX(6px);
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 900px) {

            .sidebar {
                width: 240px;
            }

            .logo {
                width: 195px;
                height: 195px;
            }

            .main-content {
                padding: 30px;
            }

            .learning-card {
                width: 100%;
            }
        }

        @media (max-width: 700px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .logo {
                width: 170px;
                height: 170px;
            }

            .sidebar-footer {
                margin-top: 30px;
            }

            .main-content {
                padding: 25px 20px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .learning-card {

                height: auto;

                min-height: 145px;

                padding: 22px;
            }

            .card-content p {
                white-space: normal;
            }
        }

    </style>
</head>


<body>

<div class="app">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">


        <div class="logo-container">

            <img
                src="learning-path-logo.png"
                alt="My Learning Path"
                class="logo"
            >

        </div>


        <div class="menu-title">
            MENU
        </div>


        <a
            href="intune.html"
            class="menu-button"
        >

            <div class="menu-icon">
                ▦
            </div>

            <div class="menu-text">
                Intune
            </div>

            <div class="menu-arrow">
                ›
            </div>

        </a>


        <div class="sidebar-footer">

            © 2026 My Learning Path.<br>
            All Rights Reserved.

        </div>


    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">


        <div class="page-header">

            <span class="home-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </div>


        <section class="hero">

            <h1>

                My
                <span class="blue">
                    Learning
                </span>
                <span class="green">
                    Path
                </span>

            </h1>


            <p>
                A collection of hands-on labs, experiments, and topics explored along my learning journey.
            </p>

        </section>


        <!-- =========================
             INTUNE TILE
        ========================== -->

        <section class="cards">


            <a
                href="intune.html"
                class="learning-card"
            >


                <div class="card-icon">

                    <div class="intune-icon">

                        <div class="screen-one"></div>

                        <div class="screen-two"></div>

                    </div>

                </div>


                <div class="card-content">

                    <h2>
                        Intune
                    </h2>

                    <p>
                        Hands-on Intune labs and topics explored
                    </p>

                </div>


                <div class="card-arrow">
                    →
                </div>


            </a>


        </section>


    </main>

</div>

</body>
</html>
